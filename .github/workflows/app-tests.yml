name: App Automated Testing
on:
  push:
    branches: [ main, dev, release/* ]
    paths: 
      - 'app/**'
      - '.github/**'
  pull_request:
    branches: [ main, dev, release/* ]
    paths: 
      - 'app/**'
      - '.github/**'
jobs:
  static-tests: 
    name: Run static tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: |
          npm ci
        working-directory: app
      - name: Formatter check
        run: |
          npm run format:check
        working-directory: app
      - name: Type check
        if: success() || failure()
        run: |
          npm run type-check
        working-directory: app
      - name: Install ESLint
        if: success() || failure()
        run: |
          npm install eslint@9.24.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0
        working-directory: app
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint .
          --config eslint.config.mjs
          --ext .js,.jsx,.ts,.tsx
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true
        working-directory: app
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/eslint-results.sarif
          wait-for-processing: true
  unit-tests: 
    needs: [static-tests]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      working-directory: app
    - run: npm run build --if-present
      working-directory: app
    - run: npm test
      working-directory: app
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: App Unit Tests
        path: app/test-results/jest/*.xml
        reporter: jest-junit
        list-tests: 'failed'
        use-actions-summary: true
  end-to-end-tests:
    needs: [static-tests]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      working-directory: app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      working-directory: app
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: app/test-results/playwright-html/playwright-report/
        retention-days: 30
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: App End-To-End Tests
        path: app/test-results/playwright/*.xml
        reporter: java-junit
        list-tests: 'failed'
        use-actions-summary: true

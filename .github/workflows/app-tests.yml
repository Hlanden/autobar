name: App Automated Testing
on:
  push:
    branches: [ main, dev, release/* ]
    paths: 
      - 'app/**'
      - '.github/**'
  pull_request:
    branches: [ main, dev, release/* ]
    paths: 
      - 'app/**'
      - '.github/**'
jobs:
  unit-tests: 
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      working-directory: app
    - run: npm run build --if-present
      working-directory: app
    - run: npm test
      working-directory: app
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: App Unit Tests
        path: app/test-results/jest/*.xml
        reporter: jest-junit
        use-actions-summary: true
  end-to-end-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      working-directory: app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      working-directory: app
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: app/playwright-report/
        retention-days: 30
    - name: Test Report
      uses: dorny/test-reporter@v2
      if: success() || failure()
      with:
        name: App End-To-End Tests
        path: app/test-results/playwright/*.xml
        reporter: java-junit
        use-actions-summary: true
